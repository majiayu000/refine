<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="diamond" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="rounded">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>
  <!-- Background -->
  <g clip-path="url(#rounded)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- Subtle border glow -->
    <rect x="1" y="1" width="510" height="510" rx="111" ry="111" fill="none" stroke="rgba(130,140,200,0.25)" stroke-width="2"/>
    <!-- Diamond -->
    <g transform="translate(256,256) rotate(45)">
      <rect x="-90" y="-90" width="180" height="180" rx="12" fill="url(#diamond)"/>
    </g>
    <!-- Diamond soft glow -->
    <g transform="translate(256,256) rotate(45)" opacity="0.4">
      <rect x="-110" y="-110" width="220" height="220" rx="20" fill="none" stroke="url(#diamond)" stroke-width="6" filter="blur(12px)"/>
    </g>
    <!-- Glass highlight -->
    <path d="M50,112 Q50,50 112,50 L400,50 Q462,50 462,112 L462,280 Q256,320 50,200 Z" fill="url(#gloss)"/>
  </g>
</svg>
